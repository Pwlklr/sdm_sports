name: SDM Python Application CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Testing against multiple Python versions is best practice for a library
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov mypy black radon
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Check formatting with black
      run: |
        black --check src/ tests/
        
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        
    - name: Static type checking with mypy
      run: |
        mypy src/ --strict
        
    - name: Test and enforce coverage with pytest
      run: |
        # Runs tests and fails if line coverage is below 90%
        pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=90
